<!-- KAVACH Case Management Template
     Add this to templates/index.html or render as a separate panel in the analyst dashboard.
     
     Features:
     - Incident list (filterable by status/sector)
     - Incident detail view with timeline
     - Alert linking UI
     - Incident linking (attack chains, related events)
     - Comment thread / collaboration
-->

<div id="case-management-panel" class="case-mgmt" style="display:none; overflow-y: auto; padding: 20px;">
  
  <!-- ===== INCIDENT LIST / OVERVIEW ===== -->
  <div id="case-list-view" class="case-view">
    <div class="case-header">
      <h2>Case Management</h2>
      <button id="btn-create-incident" class="btn btn-primary">+ New Case</button>
    </div>
    
    <!-- Filters -->
    <div class="case-filters">
      <select id="filter-status" class="form-control" style="display:inline-block; width: 150px;">
        <option value="open">Open</option>
        <option value="investigating">Investigating</option>
        <option value="closed">Closed</option>
        <option value="">All</option>
      </select>
      
      <select id="filter-sector" class="form-control" style="display:inline-block; width: 150px; margin-left: 10px;">
        <option value="">All Sectors</option>
        <option value="hospital">Hospital</option>
        <option value="power_grid">Power Grid</option>
        <option value="bank">Bank</option>
      </select>
    </div>
    
    <!-- Stats -->
    <div id="case-stats" class="case-stats">
      <div class="stat">
        <span class="stat-label">Open</span>
        <span id="stat-open" class="stat-value">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Closed</span>
        <span id="stat-closed" class="stat-value">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Avg Time to Close</span>
        <span id="stat-avg-time" class="stat-value">—</span>
      </div>
    </div>
    
    <!-- Incident List -->
    <div id="case-list-items" class="case-list-items">
      <!-- Populated dynamically -->
    </div>
  </div>
  
  
  <!-- ===== INCIDENT DETAIL VIEW ===== -->
  <div id="case-detail-view" class="case-view" style="display:none;">
    <button id="btn-back-to-list" class="btn btn-secondary" style="margin-bottom: 20px;">← Back to Cases</button>
    
    <!-- Header / Metadata -->
    <div class="case-detail-header">
      <div class="case-title-section">
        <h2 id="detail-title">Case Title</h2>
        <p id="detail-description" class="case-description"></p>
      </div>
      
      <div class="case-metadata">
        <div class="meta-row">
          <span class="meta-label">Status:</span>
          <select id="detail-status" class="form-control" style="width: 150px; display:inline-block;">
            <option value="open">Open</option>
            <option value="investigating">Investigating</option>
            <option value="closed">Closed</option>
          </select>
        </div>
        
        <div class="meta-row">
          <span class="meta-label">Severity:</span>
          <select id="detail-severity" class="form-control" style="width: 150px; display:inline-block;">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
            <option value="critical">Critical</option>
          </select>
        </div>
        
        <div class="meta-row">
          <span class="meta-label">Sector:</span>
          <span id="detail-sector">—</span>
        </div>
        
        <div class="meta-row">
          <span class="meta-label">Created by:</span>
          <span id="detail-created-by">—</span>
        </div>
        
        <button id="btn-close-case" class="btn btn-warning" style="margin-top: 10px;">Close Case</button>
        <button id="btn-delete-case" class="btn btn-danger" style="margin-top: 10px;">Delete Case</button>
      </div>
    </div>
    
    <!-- Tabs -->
    <div class="case-tabs">
      <button class="tab-btn active" data-tab="timeline">Timeline</button>
      <button class="tab-btn" data-tab="alerts">Alerts ({count})</button>
      <button class="tab-btn" data-tab="links">Related Cases</button>
      <button class="tab-btn" data-tab="comments">Comments</button>
    </div>
    
    
    <!-- TAB: TIMELINE -->
    <div id="tab-timeline" class="case-tab-content active">
      <h3>Incident Timeline</h3>
      <div id="timeline-events" class="timeline">
        <!-- Populated dynamically with alerts and comments -->
      </div>
    </div>
    
    
    <!-- TAB: ALERTS -->
    <div id="tab-alerts" class="case-tab-content" style="display:none;">
      <h3>Associated Alerts</h3>
      
      <!-- Add Alert -->
      <div class="alert-linking">
        <h4>Add Alert to Case</h4>
        <input id="input-alert-id" type="text" placeholder="Enter Alert ID" class="form-control" 
               style="width: 200px; display:inline-block; margin-right: 10px;">
        <button id="btn-add-alert" class="btn btn-primary">Add</button>
      </div>
      
      <!-- Alert List -->
      <div id="case-alerts-list" class="alerts-list">
        <!-- Populated dynamically -->
      </div>
    </div>
    
    
    <!-- TAB: RELATED CASES -->
    <div id="tab-links" class="case-tab-content" style="display:none;">
      <h3>Related Cases</h3>
      
      <!-- Link Incident -->
      <div class="incident-linking">
        <h4>Link to Another Case</h4>
        <select id="select-link-incident" class="form-control" style="width: 250px; display:inline-block;">
          <option value="">-- Select a case --</option>
        </select>
        
        <select id="select-relation-type" class="form-control" style="width: 150px; display:inline-block; margin-left: 10px;">
          <option value="related">Related</option>
          <option value="chain">Attack Chain</option>
          <option value="duplicate">Duplicate</option>
        </select>
        
        <textarea id="input-link-notes" placeholder="Notes (optional)" class="form-control" 
                  style="width: 100%; margin-top: 10px; height: 60px;"></textarea>
        
        <button id="btn-link-incident" class="btn btn-primary" style="margin-top: 10px;">Link Cases</button>
      </div>
      
      <!-- Links Display -->
      <div id="case-links-list" class="links-list" style="margin-top: 20px;">
        <!-- Populated dynamically -->
      </div>
    </div>
    
    
    <!-- TAB: COMMENTS -->
    <div id="tab-comments" class="case-tab-content" style="display:none;">
      <h3>Case Discussion</h3>
      
      <!-- Add Comment -->
      <div class="comment-input-section">
        <textarea id="input-new-comment" placeholder="Add a note or observation..." 
                  class="form-control" style="width: 100%; height: 80px;"></textarea>
        <button id="btn-add-comment" class="btn btn-primary" style="margin-top: 10px;">Post Comment</button>
      </div>
      
      <!-- Comments Thread -->
      <div id="case-comments-list" class="comments-thread">
        <!-- Populated dynamically -->
      </div>
    </div>
  </div>
</div>


<!-- ===== MODAL: CREATE INCIDENT ===== -->
<div id="modal-create-incident" class="modal" style="display:none;">
  <div class="modal-content">
    <h3>Create New Case</h3>
    
    <div class="form-group">
      <label>Title</label>
      <input id="modal-incident-title" type="text" class="form-control" placeholder="e.g., Suspicious SQL Activity - Hospital DB">
    </div>
    
    <div class="form-group">
      <label>Description</label>
      <textarea id="modal-incident-description" class="form-control" placeholder="Summary of the incident..." style="height: 100px;"></textarea>
    </div>
    
    <div class="form-group">
      <label>Sector</label>
      <select id="modal-incident-sector" class="form-control">
        <option value="">-- Select --</option>
        <option value="hospital">Hospital</option>
        <option value="power_grid">Power Grid</option>
        <option value="bank">Bank</option>
      </select>
    </div>
    
    <div class="form-group">
      <label>Severity</label>
      <select id="modal-incident-severity" class="form-control">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
        <option value="critical">Critical</option>
      </select>
    </div>
    
    <div class="modal-actions">
      <button id="btn-modal-create" class="btn btn-primary">Create Case</button>
      <button id="btn-modal-cancel" class="btn btn-secondary">Cancel</button>
    </div>
  </div>
</div>


<!-- ===== MODAL: CLOSE INCIDENT ===== -->
<div id="modal-close-incident" class="modal" style="display:none;">
  <div class="modal-content">
    <h3>Close Case</h3>
    
    <div class="form-group">
      <label>Root Cause</label>
      <textarea id="modal-root-cause" class="form-control" placeholder="What caused this incident?" style="height: 80px;"></textarea>
    </div>
    
    <div class="form-group">
      <label>Resolution Summary</label>
      <textarea id="modal-resolution" class="form-control" placeholder="What actions were taken to resolve?" style="height: 80px;"></textarea>
    </div>
    
    <div class="modal-actions">
      <button id="btn-modal-close" class="btn btn-warning">Close Case</button>
      <button id="btn-modal-close-cancel" class="btn btn-secondary">Cancel</button>
    </div>
  </div>
</div>


<!-- ===== STYLES ===== -->
<style>
.case-mgmt {
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  color: #e0e0e0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.case-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
  border-bottom: 1px solid #00d4ff;
  padding-bottom: 15px;
}

.case-header h2 {
  color: #00d4ff;
  font-size: 24px;
  margin: 0;
}

.case-filters {
  margin-bottom: 20px;
  display: flex;
  gap: 10px;
}

.case-filters select {
  background: #0f3460;
  color: #e0e0e0;
  border: 1px solid #00d4ff;
  padding: 8px 12px;
  border-radius: 4px;
  cursor: pointer;
}

.case-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-bottom: 30px;
  padding: 15px;
  background: rgba(0, 212, 255, 0.1);
  border-left: 4px solid #00d4ff;
  border-radius: 4px;
}

.stat {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.stat-label {
  font-size: 12px;
  color: #888;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.stat-value {
  font-size: 24px;
  font-weight: bold;
  color: #00d4ff;
}

/* INCIDENT LIST */
.case-list-items {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.case-item {
  background: rgba(15, 52, 96, 0.6);
  border: 1px solid #00d4ff;
  border-radius: 4px;
  padding: 15px;
  cursor: pointer;
  transition: all 0.3s ease;
}

.case-item:hover {
  background: rgba(15, 52, 96, 0.9);
  box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
  transform: translateX(5px);
}

.case-item-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

.case-item-title {
  font-weight: bold;
  color: #00d4ff;
  font-size: 16px;
}

.case-item-badge {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 3px;
  font-size: 11px;
  font-weight: bold;
  text-transform: uppercase;
}

.badge-open {
  background: #ff6b6b;
  color: white;
}

.badge-investigating {
  background: #ffd93d;
  color: #000;
}

.badge-closed {
  background: #6bcf7f;
  color: white;
}

.case-item-meta {
  font-size: 12px;
  color: #999;
}

/* DETAIL VIEW */
.case-detail-header {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 30px;
  margin-bottom: 30px;
  padding-bottom: 20px;
  border-bottom: 1px solid #00d4ff;
}

.case-title-section h2 {
  color: #00d4ff;
  margin: 0 0 10px 0;
}

.case-description {
  color: #bbb;
  line-height: 1.5;
  margin: 0;
}

.case-metadata .meta-row {
  display: flex;
  align-items: center;
  margin-bottom: 12px;
  gap: 10px;
}

.meta-label {
  color: #888;
  min-width: 120px;
  font-weight: bold;
}

/* TABS */
.case-tabs {
  display: flex;
  border-bottom: 1px solid #00d4ff;
  margin-bottom: 20px;
  gap: 0;
}

.tab-btn {
  background: none;
  border: none;
  color: #999;
  padding: 12px 20px;
  cursor: pointer;
  font-size: 14px;
  border-bottom: 2px solid transparent;
  transition: all 0.3s ease;
}

.tab-btn:hover {
  color: #00d4ff;
}

.tab-btn.active {
  color: #00d4ff;
  border-bottom-color: #00d4ff;
}

.case-tab-content {
  display: none;
  animation: fadeIn 0.3s ease;
}

.case-tab-content.active {
  display: block;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* TIMELINE */
.timeline {
  position: relative;
  padding-left: 40px;
}

.timeline-event {
  position: relative;
  margin-bottom: 20px;
  padding: 12px;
  background: rgba(0, 212, 255, 0.05);
  border-left: 3px solid #00d4ff;
  border-radius: 4px;
}

.timeline-event::before {
  content: '';
  position: absolute;
  left: -46px;
  top: 20px;
  width: 12px;
  height: 12px;
  background: #00d4ff;
  border-radius: 50%;
  border: 2px solid #1a1a2e;
}

.timeline-event.alert {
  border-left-color: #ff6b6b;
}

.timeline-event.alert::before {
  background: #ff6b6b;
}

.timeline-event.comment {
  border-left-color: #ffd93d;
}

.timeline-event.comment::before {
  background: #ffd93d;
}

.timeline-time {
  font-size: 11px;
  color: #888;
  text-transform: uppercase;
}

.timeline-content {
  margin-top: 6px;
  color: #e0e0e0;
  line-height: 1.4;
}

/* ALERTS LIST */
.alerts-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 15px;
}

.alert-item {
  background: rgba(15, 52, 96, 0.6);
  border: 1px solid #666;
  border-radius: 4px;
  padding: 10px;
  font-size: 13px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.alert-item-info {
  flex: 1;
}

.alert-item-msg {
  color: #e0e0e0;
  margin-bottom: 3px;
}

.alert-item-meta {
  font-size: 11px;
  color: #999;
}

/* COMMENTS */
.comment-input-section {
  margin-bottom: 20px;
}

.comments-thread {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.comment {
  background: rgba(15, 52, 96, 0.6);
  border-left: 3px solid #00d4ff;
  border-radius: 4px;
  padding: 12px;
}

.comment-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.comment-author {
  color: #00d4ff;
  font-weight: bold;
  font-size: 13px;
}

.comment-time {
  font-size: 11px;
  color: #888;
}

.comment-body {
  color: #e0e0e0;
  line-height: 1.5;
  white-space: pre-wrap;
  word-wrap: break-word;
}

/* INCIDENT LINKING */
.incident-linking {
  background: rgba(0, 212, 255, 0.05);
  border-left: 3px solid #00d4ff;
  padding: 15px;
  border-radius: 4px;
  margin-bottom: 20px;
}

.incident-linking h4 {
  color: #00d4ff;
  margin-top: 0;
}

.links-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.link-item {
  background: rgba(15, 52, 96, 0.6);
  border: 1px solid #666;
  border-radius: 4px;
  padding: 10px;
  font-size: 13px;
}

.link-relation {
  color: #ffd93d;
  font-weight: bold;
}

/* MODAL */
.modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.modal-content {
  background: #1a1a2e;
  border: 1px solid #00d4ff;
  border-radius: 8px;
  padding: 30px;
  width: 90%;
  max-width: 500px;
  color: #e0e0e0;
}

.modal-content h3 {
  color: #00d4ff;
  margin-top: 0;
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  margin-bottom: 6px;
  color: #888;
  font-size: 13px;
  text-transform: uppercase;
}

.form-control {
  width: 100%;
  padding: 8px 12px;
  background: #0f3460;
  color: #e0e0e0;
  border: 1px solid #00d4ff;
  border-radius: 4px;
  font-family: inherit;
  box-sizing: border-box;
}

.form-control:focus {
  outline: none;
  border-color: #00ff00;
  box-shadow: 0 0 5px rgba(0, 255, 0, 0.3);
}

.modal-actions {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 20px;
}

.btn {
  padding: 8px 16px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-size: 13px;
  font-weight: bold;
  transition: all 0.3s ease;
}

.btn-primary {
  background: #00d4ff;
  color: #000;
}

.btn-primary:hover {
  background: #00ffff;
  box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
}

.btn-secondary {
  background: #666;
  color: #e0e0e0;
}

.btn-secondary:hover {
  background: #888;
}

.btn-warning {
  background: #ff9800;
  color: #000;
}

.btn-warning:hover {
  background: #ffb74d;
}

.btn-danger {
  background: #ff6b6b;
  color: white;
}

.btn-danger:hover {
  background: #ff8787;
}

.alert-linking {
  background: rgba(0, 212, 255, 0.05);
  border-left: 3px solid #00d4ff;
  padding: 15px;
  border-radius: 4px;
  margin-bottom: 20px;
}

.alert-linking h4 {
  color: #00d4ff;
  margin-top: 0;
}
</style>
